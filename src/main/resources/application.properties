spring.application.name=HeThongKiemDinh
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# Render Free: mở web server trước, khởi tạo các bean nghiệp vụ/Mongo khi cần.
spring.main.lazy-initialization=true

# BẮT BUỘC dùng đúng database: HeThongKiemDinh
# Cấu hình MONGODB_URI theo README.md
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=HeThongKiemDinh

spring.thymeleaf.cache=false
spring.jackson.serialization.write-dates-as-timestamps=false

server.servlet.session.timeout=60m

# STORAGE
# local: Docker/local volume. supabase: lưu lâu dài trên Supabase Storage khi deploy web.
app.storage.mode=${APP_STORAGE_MODE:local}
app.storage.root=${APP_STORAGE_ROOT:${user.home}/HeThongKiemDinhStorage}
app.storage.seed-root=${APP_STORAGE_SEED_ROOT:storage-seed}
app.storage.supabase.url=${SUPABASE_URL:}
app.storage.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.storage.supabase.bucket=${SUPABASE_STORAGE_BUCKET:hethongkiemdinh}

# Tự khởi tạo/khôi phục dữ liệu demo nghiệp vụ khi MongoDB đang trống hoặc dữ liệu cũ không đồng bộ.
app.seed-demo-data=${APP_SEED_DEMO_DATA:false}

# Tài khoản quản trị khởi tạo. Khi deploy web nên đặt bằng Environment Variables.
app.default-admin.email=${APP_DEFAULT_ADMIN_EMAIL:admin@huit.edu.vn}
app.default-admin.password=${APP_DEFAULT_ADMIN_PASSWORD:123456}
