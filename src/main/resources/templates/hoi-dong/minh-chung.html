<!DOCTYPE html>
<html lang="vi">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Hội đồng - Minh chứng
  </title>
  <link href="/css/app.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="top">
   <div>
    ◉ Hệ thống ĐBCL - Khu vực Hội đồng tự đánh giá
   </div>
  </div>
  <div class="shell">
   <aside class="sidebar">
    <div class="user">
     <div class="avatar">
      HĐ
     </div>
     <div>
      <b>
       Hội đồng
      </b>
      <small>
       Hội đồng tự đánh giá
      </small>
     </div>
    </div>
    <nav class="nav">
     <a href="/hoi-dong">
      ▦
      <span>
       Tổng quan
      </span>
     </a>
     <a href="/hoi-dong/minh-chung">
      ▧
      <span>
       Minh chứng đã duyệt
      </span>
     </a>
     <a href="/hoi-dong/bao-cao">
      ▱
      <span>
       Báo cáo tiêu chí
      </span>
     </a>
     <a href="/hoi-dong/danh-gia">
      ✓
      <span>
       Đánh giá tiêu chí
      </span>
     </a>
     <a href="/hoi-dong/tong-hop">
      ∑
      <span>
       Tổng hợp báo cáo
      </span>
     </a>
    </nav>
   </aside>
   <main class="main">
    <div class="page-head">
     <h1>
      Minh chứng đã duyệt
     </h1>
    </div>
    <div class="card">
     <div class="card-body">
      <div class="toolbar">
       <div class="toolbar-left">
        <input id="q" placeholder="Tìm mã, tên minh chứng..."/>
        <select id="fTc">
         <option value="">
          Tất cả tiêu chuẩn
         </option>
        </select>
        <select id="fTchi">
         <option value="">
          Tất cả tiêu chí
         </option>
        </select>
       </div>
      </div>
      <div class="table-wrap">
       <table>
        <thead>
         <tr>
          <th>
           Mã MC
          </th>
          <th>
           Tiêu chuẩn
          </th>
          <th>
           Tiêu chí
          </th>
          <th>
           Tên minh chứng
          </th>
          <th>
           File
          </th>
          <th>
           Trạng thái
          </th>
          <th>Thao tác</th>
         </tr>
        </thead>
        <tbody id="rows">
        </tbody>
       </table>
      </div>
     </div>
    </div>
    <div class="modal" id="evidenceReviewModal">
     <div class="modal-box">
      <div class="modal-head"><span>Hội đồng đánh giá minh chứng</span><button onclick="closeModal('evidenceReviewModal')">×</button></div>
      <div class="modal-body">
       <div class="field"><label>Loại đánh giá</label><select id="evidenceReviewType"><option value="Đánh giá">Đánh giá</option><option value="Góp ý">Góp ý</option><option value="Yêu cầu chỉnh sửa">Yêu cầu chỉnh sửa</option></select></div>
       <div class="field"><label>Nhận xét / phản hồi</label><textarea id="evidenceReviewNote" rows="5"></textarea></div>
      </div>
      <div class="modal-foot"><button class="btn-light" onclick="closeModal('evidenceReviewModal')">Hủy</button><button class="btn-primary" onclick="saveEvidenceReview()">Lưu đánh giá</button></div>
     </div>
    </div>
   </main>
  </div>
  <script src="/js/common.js">
  </script>
  <script>

     let mc = [], tc = [], tchi = [], evidenceReviewId = null;
  async function load() {
    [mc, tc, tchi] = await Promise.all([api('/hoi-dong/minh-chung'), api('/tieu-chuan'), api('/tieu-chi')]);
    $('#fTc').innerHTML = '<option value="">Tất cả tiêu chuẩn</option>' + tc.map(x => `<option value="${esc(x.id)}">${esc(x.id)} - ${esc(x.tenTieuChuan || '')}</option>`).join('');
    filterCriteria();
    render();
  }
  function filterCriteria() {
    const v = $('#fTc').value;
    $('#fTchi').innerHTML = '<option value="">Tất cả tiêu chí</option>' + tchi.filter(x => !v || x.maTieuChuan === v).map(x => `<option value="${esc(x.id)}">${esc(x.id)} - ${esc(x.tenTieuChi || '')}</option>`).join('');
  }
  function render() {
    const q = $('#q').value.toLowerCase(), a = $('#fTc').value, b = $('#fTchi').value;
    const list = mc.filter(x => (!q || JSON.stringify(x).toLowerCase().includes(q)) && (!a || x.maTieuChuan === a) && (!b || x.maTieuChi === b));
    $('#rows').innerHTML = list.map(x => `<tr>
  <td>
  <span class="role-code">${esc(x.maMinhChung || x.id)}</span>
  </td>
  <td>${esc(x.maTieuChuan || '')}</td>
  <td>
  <b>${esc(x.maTieuChi || '')}</b>
  </td>
  <td>${esc(x.tenMinhChung || '')}<br>
  <small>${esc(x.moTa || '')}</small>
  </td>
  <td>${evidenceFileHtml(x)}</td>
  <td>
  <span class="badge ${statusBadge(x.trangThai)}">${esc(x.trangThai || '')}</span>
  </td>
  <td><button class="btn-primary" onclick="openEvidenceReview('${x.id}')">Đánh giá / phản hồi</button></td>
  </tr>`).join('') || '<tr><td colspan="7" class="empty">Chưa có minh chứng đã duyệt</td></tr>';
  }
  $('#q').addEventListener('input', render);
  $('#fTchi').addEventListener('change', render);
  $('#fTc').addEventListener('change', () => {
    filterCriteria();
    render();
  });
  function openEvidenceReview(id) { evidenceReviewId=id; $('#evidenceReviewType').value='Đánh giá'; $('#evidenceReviewNote').value=''; openModal('evidenceReviewModal'); }
  async function saveEvidenceReview() { const note=$('#evidenceReviewNote').value.trim(); if(!note) return alert('Vui lòng nhập nhận xét.'); try { await api('/hoi-dong/minh-chung/'+encodeURIComponent(evidenceReviewId)+'/feedback',{method:'POST',body:JSON.stringify({loai:$('#evidenceReviewType').value,nhanXet:note})}); closeModal('evidenceReviewModal'); await load(); } catch(e){ alert(e.message); } }
  load();
</script>
 </body>
</html>
