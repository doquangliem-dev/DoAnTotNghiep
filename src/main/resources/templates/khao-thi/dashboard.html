<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tổng quan Bộ phận khảo thí</title><link rel="stylesheet" href="/css/app.css"></head>
<body><div class="top">◉ Hệ thống ĐBCL - Tự đánh giá & Kiểm định CTĐT</div><div class="shell"><aside class="sidebar"><div class="user"></div><nav class="nav"><a href="/khao-thi">Tổng quan</a><a href="/khao-thi/ke-hoach">Phê duyệt kế hoạch</a><a href="/khao-thi/bao-cao">Duyệt báo cáo</a><a href="/khao-thi/tong-hop">Theo dõi kết quả</a></nav><div class="version">Phiên bản: HeThongKiemDinh29<br>Bộ tiêu chuẩn MOET</div></aside><main class="main"><h1>Tổng quan Bộ phận khảo thí</h1><p class="subtitle">Khu vực Bộ phận khảo thí</p><div class="stats" id="stats"></div></main></div><script src="/js/common.js"></script><script>async function load(){const d=await api('/khao-thi/dashboard');const pairs=Object.entries(d).filter(([k,v])=>typeof v==='number').slice(0,6);$('#stats').innerHTML=pairs.map(([k,v])=>`<div class="stat"><b>${v}</b><span>${esc(k.replace(/([A-Z])/g,' $1'))}</span></div>`).join('');}load();</script></body></html>
