<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tổng hợp kết quả</title><link rel="stylesheet" href="/css/app.css"></head>
<body><div class="top">◉ Hệ thống ĐBCL - Tự đánh giá & Kiểm định (Thông tư 04/2025)</div><div class="shell"><aside class="sidebar"><div class="user"></div><nav class="nav"><a href="/khao-thi">Tổng quan</a><a href="/khao-thi/ke-hoach">Phê duyệt kế hoạch</a><a href="/khao-thi/tong-hop">Theo dõi kết quả</a></nav><div class="version">Phiên bản: HeThongKiemDinh24<br>Thông tư 04/2025/TT-BGDĐT</div></aside><main class="main"><h1>Tổng hợp kết quả</h1><p class="subtitle">Khu vực Bộ phận khảo thí</p><div class="toolbar"><select id="plan"><option value="">Tất cả kế hoạch</option></select></div><div class="card"><table><thead><tr><th>Tiêu chuẩn</th><th>Số tiêu chí</th><th>Báo cáo</th><th>Minh chứng duyệt</th><th>Đã đánh giá</th><th>Đạt</th><th>Không đạt</th><th>Hoàn thành</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script src="/js/common.js"></script><script>let plans=[];async function loadPlans(){plans=await api('/khao-thi/ke-hoach');plan.innerHTML='<option value="">Tất cả kế hoạch</option>'+plans.map(x=>`<option value="${esc(x.id)}">${esc(x.id)} - ${esc(x.tenKeHoach||'')}</option>`).join('')}async function load(){const v=plan.value;const d=await api('/khao-thi/tong-hop'+(v?'?maKeHoach='+encodeURIComponent(v):''));rows.innerHTML=(d.tieuChuan||[]).map(x=>`<tr><td>${x.maTieuChuan} - ${esc(x.tenTieuChuan||'')}</td><td>${x.tongTieuChi}</td><td>${x.soBaoCao}</td><td>${x.minhChungDaDuyet}</td><td>${x.daDanhGia}</td><td>${x.dat}</td><td>${x.khongDat}</td><td>${x.tyLeHoanThanh}%</td></tr>`).join('');}plan.onchange=load;(async()=>{await loadPlans();await load()})();</script></body></html>
