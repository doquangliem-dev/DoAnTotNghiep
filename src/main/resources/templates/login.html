<!DOCTYPE html>
<html lang="vi">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Đăng nhập - Hệ thống kiểm định
  </title>
  <link href="/css/app.css" rel="stylesheet"/>
 </head>
 <body class="login-page">
  <div class="login-shell">
   <section class="login-brand">
    <div class="login-brand-inner">
     <div class="huit-brand-lockup">
      <div class="login-logo official">
       <img alt="Logo HUIT" src="/images/logo-huit.png"/>
      </div>
     </div>
     <h1>
      Hệ thống quản lý tự đánh giá &amp; kiểm định chất lượng CTĐT
     </h1>
    </div>
   </section>
   <section class="login-panel">
    <form class="login-card" id="loginForm">
     <div class="login-title">
      <h2>
       Đăng nhập hệ thống
      </h2>
      <p>
       Sử dụng email được Quản trị viên cấp làm tài khoản đăng nhập.
      </p>
     </div>
     <div class="field">
      <label>
       Email / Tài khoản
      </label>
      <input autocomplete="username" autofocus="" id="email" placeholder="vidu@huit.edu.vn" required="" type="email"/>
     </div>
     <div class="field">
      <label>
       Mật khẩu
      </label>
      <div class="password-wrap">
       <input autocomplete="current-password" id="matKhau" placeholder="Nhập mật khẩu" required="" type="password"/>
       <button class="password-toggle" id="togglePassword" type="button">
        Hiện
       </button>
      </div>
     </div>
     <div class="login-error" id="error">
     </div>
     <button class="btn-primary login-submit" id="btnLogin" type="submit">
      Đăng nhập
     </button>
     <div class="login-help">
      Nếu chưa có tài khoản, liên hệ Quản trị viên để được tạo tài khoản và phân vai trò.
     </div>
    </form>
   </section>
  </div>
  <script>

     const form = document.getElementById('loginForm');
  const err = document.getElementById('error');
  const btn = document.getElementById('btnLogin');
  document.getElementById('togglePassword').onclick = () => {
    const p = document.getElementById('matKhau');
    const show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    document.getElementById('togglePassword').textContent = show ? 'Ẩn' : 'Hiện';
  };
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Đang đăng nhập...';
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST', headers: {
          'Content-Type': 'application/json'
        }, body: JSON.stringify({
          email: document.getElementById('email').value.trim(), matKhau: document.getElementById('matKhau').value
        })
      });
      if (!r.ok) {
        let msg = 'Đăng nhập không thành công';
        try {
          const j = await r.json();
          msg = j.message || j.detail || msg;
        }
                 catch (_) {
          const t = await r.text();
          if (t)
                         msg = t;
        }
        throw new Error(msg);
      }
      const me = await r.json();
      location.href = me.home || '/';
    }
         catch (ex) {
      err.textContent = ex.message;
    }
         finally {
      btn.disabled = false;
      btn.textContent = 'Đăng nhập';
    }
    });
</script>
 </body>
</html>
