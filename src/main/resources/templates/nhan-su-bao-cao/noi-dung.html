<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nội dung báo cáo được giao</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="top"><span>Hệ thống ĐBCL - Tự đánh giá & Kiểm định CTĐT</span><span>Nhân sự báo cáo · Nội dung</span></div><div class="shell"><aside class="sidebar"><div class="user"><div class="avatar">BC</div><div><b>Nhân sự báo cáo</b><small>Phần 1, 3, 4</small></div></div><nav class="nav"><a href="/nhan-su-bao-cao">Tổng quan</a><a href="/nhan-su-bao-cao/noi-dung">Nội dung được giao</a></nav><div class="version">HeThongKiemDinh29<br>Bộ tiêu chuẩn MOET</div></aside><main class="main"><div class="page-head"><h1>Nội dung báo cáo được giao</h1><p>Soạn nội dung Phần 1, Phần 3 hoặc Phần 4 theo phân công của Admin.</p></div><div id="cards"></div><div class="modal" id="edit"><div class="modal-box" style="max-width:900px"><div class="modal-head"><span id="title">Soạn nội dung</span><button onclick="closeModal('edit')">×</button></div><div class="modal-body"><div class="notice" id="hint"></div><div id="editorFields"></div></div><div class="modal-foot"><button class="btn-light" onclick="closeModal('edit')">Đóng</button><button class="btn-light" onclick="save(false)">Lưu nháp</button><button class="btn-primary" onclick="save(true)">Lưu và gửi Admin duyệt</button></div></div></div></main></div><script src="/js/common.js"></script><script>let jobs=[],parts=[],current=null;async function load(){[jobs,parts]=await Promise.all([api('/nhan-su-bao-cao/cong-viec'),api('/nhan-su-bao-cao/bao-cao-phan')]);cards.innerHTML=jobs.map(j=>{const p=parts.find(x=>x.maPhanCong===j.id);return `<div class="card" style="margin-bottom:14px"><div class="card-body"><div class="toolbar"><div><b>${esc(j.tenCongViec||('Phần '+j.soPhan))}</b><div class="muted">${esc(j.noiDungCongViec||'')}</div></div><span class="badge ${statusBadge(p?.trangThai||j.trangThai)}">${esc(p?.trangThai||j.trangThai||'')}</span></div><div class="actions"><button class="btn-primary" onclick="editPart('${p?.id||''}')" ${p?'':'disabled'}>Soạn / Xem nội dung</button></div></div></div>`}).join('')||'<div class="empty">Chưa có phân công báo cáo.</div>'}function valOf(o,k){return o&&o[k]!==undefined&&o[k]!==null?o[k]:''}
function textareaField(id,label,value,rows=5){return `<div class="field"><label>${esc(label)}</label><textarea id="${id}" rows="${rows}">${esc(value||'')}</textarea></div>`}
function numberField(id,label,value){return `<div class="field"><label>${esc(label)}</label><input id="${id}" type="number" min="0" value="${esc(String(value??0))}"></div>`}
function renderEditor(p){
  const o=(p?.noiDung&&typeof p.noiDung==='object')?p.noiDung:{};
  if(p.soPhan===1){
    editorFields.innerHTML=
      textareaField('f_datVanDe','1. Đặt vấn đề',valOf(o,'datVanDe')||valOf(o,'noiDungChinh'),5)+
      textareaField('f_tongQuanCoSoGiaoDuc','2. Tổng quan về cơ sở giáo dục',valOf(o,'tongQuanCoSoGiaoDuc'),5)+
      textareaField('f_tongQuanDonViDaoTao','3. Tổng quan về đơn vị đào tạo',valOf(o,'tongQuanDonViDaoTao'),5)+
      textareaField('f_tongQuanCTDT','4. Tổng quan về chương trình đào tạo',valOf(o,'tongQuanCTDT'),5)+
      textareaField('f_phuongPhapTuDanhGia','5. Phương pháp tự đánh giá',valOf(o,'phuongPhapTuDanhGia'),5);
    return;
  }
  if(p.soPhan===3){
    const k=o.ketQuaTuDanhGia||{};
    editorFields.innerHTML=
      textareaField('f_tongHopDiemManh','1. Tổng hợp điểm mạnh',valOf(o,'tongHopDiemManh')||valOf(o,'noiDungChinh'),5)+
      textareaField('f_tongHopTonTai','2. Tổng hợp tồn tại / điểm cần cải tiến',valOf(o,'tongHopTonTai'),5)+
      textareaField('f_tongHopKeHoachCaiTien','3. Kế hoạch cải tiến chất lượng',valOf(o,'tongHopKeHoachCaiTien'),5)+
      `<div class="form-grid">${numberField('f_tongSoTieuChi','Tổng số tiêu chí',valOf(k,'tongSoTieuChi')||52)}${numberField('f_daDanhGia','Đã đánh giá',valOf(k,'daDanhGia'))}${numberField('f_dat','Đạt',valOf(k,'dat'))}${numberField('f_khongDat','Không đạt',valOf(k,'khongDat'))}</div>`;
    return;
  }
  if(p.soPhan===4){
    const check=(id,label,key)=>`<label style="display:flex;gap:10px;align-items:center;padding:12px;border:1px solid #e1e7ef;border-radius:10px;margin-bottom:10px"><input id="${id}" type="checkbox" ${o[key]?'checked':''}><span><b>${esc(label)}</b></span></label>`;
    editorFields.innerHTML=`<div class="notice" style="margin-bottom:12px">Đánh dấu các thành phần phụ lục đã chuẩn bị đầy đủ.</div>`+
      check('f_bangTongHopKetQua','Bảng tổng hợp kết quả','bangTongHopKetQua')+
      check('f_coSoDuLieuKiemDinh','Cơ sở dữ liệu kiểm định','coSoDuLieuKiemDinh')+
      check('f_danhMucMinhChung','Danh mục minh chứng','danhMucMinhChung')+
      check('f_cacQuyetDinhLienQuan','Các quyết định / văn bản liên quan','cacQuyetDinhLienQuan');
    return;
  }
  editorFields.innerHTML=textareaField('f_noiDungChinh','Nội dung chính',typeof p.noiDung==='string'?p.noiDung:valOf(o,'noiDungChinh'),12);
}
function collectContent(){
  if(current.soPhan===1)return {
    datVanDe:$('#f_datVanDe').value.trim(),
    tongQuanCoSoGiaoDuc:$('#f_tongQuanCoSoGiaoDuc').value.trim(),
    tongQuanDonViDaoTao:$('#f_tongQuanDonViDaoTao').value.trim(),
    tongQuanCTDT:$('#f_tongQuanCTDT').value.trim(),
    phuongPhapTuDanhGia:$('#f_phuongPhapTuDanhGia').value.trim()
  };
  if(current.soPhan===3)return {
    tongHopDiemManh:$('#f_tongHopDiemManh').value.trim(),
    tongHopTonTai:$('#f_tongHopTonTai').value.trim(),
    tongHopKeHoachCaiTien:$('#f_tongHopKeHoachCaiTien').value.trim(),
    ketQuaTuDanhGia:{tongSoTieuChi:+$('#f_tongSoTieuChi').value||0,daDanhGia:+$('#f_daDanhGia').value||0,dat:+$('#f_dat').value||0,khongDat:+$('#f_khongDat').value||0}
  };
  if(current.soPhan===4)return {
    bangTongHopKetQua:$('#f_bangTongHopKetQua').checked,
    coSoDuLieuKiemDinh:$('#f_coSoDuLieuKiemDinh').checked,
    danhMucMinhChung:$('#f_danhMucMinhChung').checked,
    cacQuyetDinhLienQuan:$('#f_cacQuyetDinhLienQuan').checked
  };
  return {noiDungChinh:$('#f_noiDungChinh')?.value?.trim()||''};
}
function editPart(id){current=parts.find(x=>x.id===id);if(!current)return;title.textContent=current.tenPhan||('Phần '+current.soPhan);hint.textContent=current.soPhan===1?'Khái quát: đặt vấn đề, tổng quan cơ sở giáo dục, đơn vị đào tạo, CTĐT và phương pháp tự đánh giá.':current.soPhan===3?'Kết luận: tổng hợp điểm mạnh, tồn tại, kế hoạch cải tiến và kết quả tự đánh giá.':'Phụ lục: kiểm tra các bảng tổng hợp, cơ sở dữ liệu, quyết định/văn bản và danh mục minh chứng.';renderEditor(current);openModal('edit')}
async function save(send){try{current.noiDung=collectContent();current=await api('/nhan-su-bao-cao/bao-cao-phan',{method:'POST',body:JSON.stringify(current)});if(send)current=await api('/nhan-su-bao-cao/bao-cao-phan/'+encodeURIComponent(current.id)+'/gui-duyet',{method:'POST'});closeModal('edit');await load()}catch(e){alert(e.message)}}
load();</script></body></html>
