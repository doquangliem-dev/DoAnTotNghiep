spring.application.name=HeThongKiemDinh24
server.port=8080

# BẮT BUỘC dùng đúng database: HeThongKiemDinh
# Cấu hình MONGODB_URI theo README.md
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=HeThongKiemDinh

spring.thymeleaf.cache=false
spring.jackson.serialization.write-dates-as-timestamps=false

server.servlet.session.timeout=60m

# Thu muc luu file BEN VUNG, nam ngoai thu muc source/build.
# Co the doi bang bien moi truong APP_STORAGE_ROOT neu can.
# Mac dinh: C:\\Users\\<user>\\HeThongKiemDinhStorage tren Windows.
app.storage.root=${APP_STORAGE_ROOT:${user.home}/HeThongKiemDinhStorage}
