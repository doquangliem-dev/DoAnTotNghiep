<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phê duyệt kế hoạch</title><link rel="stylesheet" href="/css/app.css"></head>
<body><div class="top">◉ Hệ thống ĐBCL - Tự đánh giá & Kiểm định (Thông tư 04/2025)</div><div class="shell"><aside class="sidebar"><div class="user"></div><nav class="nav"><a href="/khao-thi">Tổng quan</a><a href="/khao-thi/ke-hoach">Phê duyệt kế hoạch</a><a href="/khao-thi/tong-hop">Theo dõi kết quả</a></nav><div class="version">Phiên bản: HeThongKiemDinh24<br>Thông tư 04/2025/TT-BGDĐT</div></aside><main class="main"><h1>Phê duyệt kế hoạch</h1><p class="subtitle">Khu vực Bộ phận khảo thí</p><div class="card"><table><thead><tr><th>Mã</th><th>Kế hoạch</th><th>CTĐT</th><th>Bộ tiêu chuẩn</th><th>Thời gian</th><th>Trạng thái</th><th>Phê duyệt</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script src="/js/common.js"></script><script>async function load(){const a=await api('/khao-thi/ke-hoach');rows.innerHTML=a.map(x=>`<tr><td>${x.id}</td><td>${esc(x.tenKeHoach)}</td><td>${x.maCTDT||''}</td><td>${x.maBoTieuChuan||''}</td><td>${fmtDate(x.ngayBatDau)} → ${fmtDate(x.ngayKetThuc)}</td><td><span class="badge ${statusBadge(x.trangThai)}">${esc(x.trangThai)}</span></td><td>${x.trangThai==='Chờ khảo thí duyệt'?`<button class="btn-primary" onclick="review('${x.id}','Duyệt')">Phê duyệt</button> <button class="btn-danger" onclick="review('${x.id}','Yêu cầu chỉnh sửa')">Yêu cầu sửa</button>`:'-'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Chưa có kế hoạch</td></tr>';}async function review(id,k){const note=prompt('Nhận xét:')||'';await api('/khao-thi/ke-hoach/'+id+'/duyet',{method:'POST',body:JSON.stringify({ketQua:k,nhanXet:note})});load()}load();</script></body></html>
